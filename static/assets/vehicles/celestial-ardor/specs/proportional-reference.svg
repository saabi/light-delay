<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
<title id="title">Celestial Ardor — proportional orthographic reference</title>
<desc id="desc">Dimensionally proportional side cutaway of the Celestial Ardor, 90 m long by 18 m maximum diameter, with transverse decks and three axial circulation trunks.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 z" fill="#24435f"/>
  </marker>
  <marker id="arrow2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M8,0 L0,4 L8,8 z" fill="#24435f"/>
  </marker>
</defs>
<style>
  .bg { fill:#f7f9fb; }
  .panel { fill:#ffffff; stroke:#b9c7d3; stroke-width:1.2; }
  .ink { fill:#10253d; font-family:Segoe UI, Arial, sans-serif; }
  .title { font-size:34px; font-weight:800; letter-spacing:.6px; }
  .subtitle { font-size:15px; font-weight:700; fill:#8b6400; letter-spacing:.5px; }
  .h { font-size:17px; font-weight:800; fill:#173f67; }
  .sh { font-size:12px; font-weight:800; fill:#173f67; }
  .body { font-size:11.5px; fill:#26394b; }
  .small { font-size:10px; fill:#465d70; }
  .tiny { font-size:8.5px; fill:#50677a; }
  .outline { fill:none; stroke:#20384f; stroke-width:2.5; }
  .thin { fill:none; stroke:#5a7185; stroke-width:1.2; }
  .dim { fill:none; stroke:#24435f; stroke-width:1.2; marker-start:url(#arrow2); marker-end:url(#arrow); }
  .dash { stroke-dasharray:7 5; }
  .center { text-anchor:middle; }
  .right { text-anchor:end; }
</style>
