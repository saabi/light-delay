name: Light Delay project-data integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  project-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:project:light-delay
      - run: npm run validate:schemas
        if: always()
      - run: npm run generated:check
        if: always()
      - run: npm run report:causal-validity
        if: always()
      - run: npm run report:causal-structure
        if: always()
      - run: npm run validate:docs
        if: always()
      - run: npm run validate:translations
        if: always()
      - name: Run complete legacy application suite with one exact stale-data quarantine
        if: always()
        run: npm run test:legacy:compat

      - name: Re-run the quarantined Festival shot-count assertion
        if: always()
        run: npm run test:legacy:known-data

      - name: Install browser for the exact Okoye data audit
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Audit the exact stale Okoye voice-copy expectation
        if: always()
        run: bash scripts/ci/audit-known-okoye-e2e.sh
