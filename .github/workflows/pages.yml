name: Deploy SvelteKit to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structured data
        run: npm run validate:data

      - name: Verify generated editorial artifacts
        run: npm run generated:check

      - name: Validate causal ledger
        run: npm run report:causal-validity

      - name: Validate documentation
        run: npm run validate:docs

      - name: Validate public translations
        run: npm run validate:translations

      - name: Type-check SvelteKit
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
