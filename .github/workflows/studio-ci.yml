name: Studio and shared foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/studio_test
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:v2-core
      - name: Run M2 contract and core tests (in-memory)
        run: npm run test:v2-core
      - run: npm run migrate:studio
      - name: Run M2 contract and integration tests (PostgreSQL)
        run: npm run test:postgres
      - run: npm run check:studio
      - run: npm run test:studio
      - run: npm run build:studio
      - name: Install Studio browser
        run: npx playwright install --with-deps chromium
      - name: Verify Studio authoring workflow
        run: npm run test:studio:e2e
      - name: Verify deployment helpers
        run: |
          bash -n tools/deploy/stage-activate.sh
          bash -n tools/deploy/stage-remote.sh
          bash -n tools/deploy/package-stage.sh
          npm run test:deploy
      - name: Start the packaged release in isolation
        run: |
          bash tools/deploy/package-stage.sh "$GITHUB_SHA" "$RUNNER_TEMP/studio-release.tgz"
          bash tools/deploy/smoke-stage.sh "$RUNNER_TEMP/studio-release.tgz" "$GITHUB_SHA"
